# SSH port forwarding is OFF on this NVR.
# Installed as /etc/ssh/sshd_config.d/10-forwarding.conf.
#
# sshd reported "permitopen any": an authenticated session could
# forward to ANY host and port reachable from this NVR, including every
# camera on every port. That is a broader capability than the firewall
# grants the same operator -- P2 restricts the camera segment to
# Frigate RTSP, admin ssh and an on-demand web window, and a forward
# through this host walked around all of it.
#
# It was first scoped to the camera web ports and the Frigate UI. Then
# the operator said they do not use SSH forwarding at all: the web GUIs
# are reached directly by URL in a browser. So the capability is simply
# gone. That is strictly tighter than the allowlist it replaced, and it
# has nothing to keep in sync -- the scoped version carried 27
# destinations needing revision every time a camera's web port changed
# on conversion. Turning off what nobody uses is the cheapest security
# change available.
#
# TO RE-ENABLE SCOPED FORWARDING, if it is ever wanted: set
# AllowTcpForwarding to "local" and add ONE PermitOpen line listing
# host:port destinations -- each camera's tcp/80 and tcp/443, plus the
# Frigate UI at 127.0.0.1:8971, 88.255.5.11:8971 and 172.19.0.2:8971.
# That exact policy was installed and verified working on 2026-10-22
# (camera web and Frigate UI forwarded; camera 554, camera 22 and an
# arbitrary internet host were refused). Deliberately do NOT include
# camera tcp/554: the NVR host cannot reach it either, and the operator
# and camera session agreed to keep it that way, so a forward must not
# become the exception that puts it back.
#
# THREE THINGS THAT BIT ME HERE, all worth knowing:
#   1. Multiple PermitOpen lines do NOT accumulate. sshd takes the
#      first value obtained for a keyword and ignores the rest, so
#      eight tidy lines of four destinations produced a policy
#      permitting cameras 1 and 2 only.
#   2. An edit script that split this file on the literal string
#      "AllowTcpForwarding local" -- which also appears in the prose --
#      left the directive after a "# " and silently did nothing, while
#      sshd went on reporting "yes".
#   3. The same trick with "PermitOpen " matched the words in a comment
#      and left the real directive live further down the file.
# All three were caught by reading the result back from "sshd -T".
# Never trust this file to mean what it looks like it means.
#
# Auth is deliberately untouched. PasswordAuthentication yes is how
# this box is reached today; it belongs in the same change as the
# conversion to keys, not before it. PermitRootLogin without-password
# is worth revisiting then too. AllowAgentForwarding and X11Forwarding
# are separate settings, unaffected by this one, and both still on.
#
# sshd_config.d is included at line 8 of sshd_config, before any of the
# main file's own settings, so values here win.

AllowTcpForwarding no
