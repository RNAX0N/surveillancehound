# Scope SSH port forwarding to the things it is actually for.
# Installed as /etc/ssh/sshd_config.d/10-forwarding.conf.
#
# Before this, sshd reported "permitopen any": an authenticated session
# could forward to ANY host and port reachable from this NVR, which
# includes every camera on every port and anything the NVR can route
# to. That is a broader capability than the firewall grants the same
# operator -- P2 restricts the camera segment to Frigate RTSP, admin
# ssh and an on-demand web window, and a forward through this host
# walked around all of it.
#
# Allowed below: each camera's two web ports, and the Frigate UI by
# each address it answers on. That is enough for
#     ssh -L 8443:117.111.106.2:443 nvr
# which reaches a camera web UI with NO firewall opening at all, since
# the NVR can already talk to those ports itself.
#
# NOT allowed, deliberately: camera tcp/554. The NVR host cannot reach
# it either (inet myfw's output chain permits no 554) and the operator
# and camera session agreed to leave it that way, so a forward must not
# become the exception that reintroduces it.
#
# ONE PermitOpen LINE, and it has to be. Multiple PermitOpen lines do
# NOT accumulate: sshd takes the first value obtained for a keyword and
# ignores the rest. Split across eight lines, "sshd -T" reported a
# policy permitting cameras 1 and 2 only -- the file looked right and
# the effective policy was not.
#
# Read the result back from "sshd -T", never from this file. That check
# caught the line-splitting above, and then caught the local-forwarding
# directive below being swallowed into a comment by an editing script.
#
# Auth is deliberately untouched. PasswordAuthentication yes is how
# this box is reached today; it belongs in the same change as the
# conversion to keys, not before it. PermitRootLogin without-password
# is worth revisiting then too. AllowAgentForwarding is also still on,
# because disabling it would break hopping to a camera via this host
# and nobody asked for that.
#
# sshd_config.d is included at line 8 of sshd_config, before any of the
# main file's own settings, so values here win.
#
# Local forwarding only: keeps -L and -D, drops -R, so a session cannot
# ask this host to listen on the operator's behalf.

AllowTcpForwarding local

PermitOpen 117.111.101.2:80 117.111.101.2:443 117.111.102.2:80 117.111.102.2:443 117.111.103.2:80 117.111.103.2:443 117.111.104.2:80 117.111.104.2:443 117.111.105.2:80 117.111.105.2:443 117.111.106.2:80 117.111.106.2:443 117.111.107.2:80 117.111.107.2:443 117.111.108.2:80 117.111.108.2:443 117.111.109.2:80 117.111.109.2:443 117.111.110.2:80 117.111.110.2:443 117.111.111.2:80 117.111.111.2:443 117.111.112.2:80 117.111.112.2:443 127.0.0.1:8971 88.255.5.11:8971 172.19.0.2:8971
