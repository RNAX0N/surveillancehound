; configd actions for the SurveillanceHound service.
;
; Each [name] is invoked from PHP via configd_run("hound <name>").
; The MVC ApiMutableServiceControllerBase shells out to start / stop /
; restart / status / reload on save and on the dashboard buttons.

[start]
command:/usr/local/etc/rc.d/hound onestart
parameters:
type:script
message:starting hound

[stop]
command:/usr/local/etc/rc.d/hound onestop
parameters:
type:script
message:stopping hound

[restart]
command:/usr/local/etc/rc.d/hound onerestart
parameters:
type:script
message:restarting hound

[reload]
; render the hound.toml from the Volt template, then signal the daemon
command:/usr/local/opnsense/scripts/OPNsense/Hound/reload.sh
parameters:
type:script
message:reloading hound config

[status]
command:/usr/local/etc/rc.d/hound onestatus
parameters:
type:script
message:querying hound status

[dashboard]
; One JSON document for the plugin's dashboard tab. The page cannot iframe
; the daemon's own web server — OPNsense serves its UI under
; `default-src 'self'`, so a frame on another port is cross-origin and the
; browser blocks it. Rendering natively through this keeps it same-origin
; and inherits the firewall's theme.
command:/usr/local/bin/hound export /usr/local/etc/hound.toml --limit
parameters:%s
type:script_output
message:collecting hound dashboard data

[forget-unclaimed]
; Drop every camera/nvr row the config no longer claims, with its outage
; history. The device register is a union of configured and observed, and
; nothing ever leaves it on its own: roles never downgrade and prune()
; deletes only CLOSED outages, so a camera this box can never see again
; stays on the dashboard as permanently down. Most relevant on a collector
; whose cameras moved behind an agent.
command:/usr/local/bin/hound devices /usr/local/etc/hound.toml --forget-unclaimed
parameters:
type:script_output
message:removing stale hound device rows

[forget-device]
; Drop ONE device row and its outage history, by address. The dashboard's
; per-row button. Needed alongside forget-unclaimed because a row whose
; address is still in this box's Camera IPs is "claimed" and that button
; will not touch it — yet it can still be stale, because device rows come
; only from OBSERVED traffic, never from the config. A camera that moved
; behind a relay agent leaves a local row this box can no longer see and
; will never re-create on its own.
;
; The address is validated as an IP in PHP before it reaches this line,
; because %s is interpolated into a command line.
command:/usr/local/bin/hound devices /usr/local/etc/hound.toml --forget
parameters:%s
type:script_output
message:removing one hound device row
