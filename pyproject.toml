[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveillancehound"
version = "0.1.5"
description = "Always-running NVR / IP-camera network monitor — logs and flags anomalous traffic on the surveillance segment."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
# Deliberately zero runtime dependencies. The pcap parser is pure-Python; live
# capture uses tcpdump as a subprocess (apt install tcpdump). Notifications use
# urllib from the standard library.
dependencies = []

[project.scripts]
hound = "surveillancehound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
